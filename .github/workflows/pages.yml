name: Publish UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'scripts/prepare_public_site.py'
      - 'scripts/check_public_site.py'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare UI with existing WebAssembly engine
        run: python3 scripts/prepare_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish project site
        id: deployment
        uses: actions/deploy-pages@v4
